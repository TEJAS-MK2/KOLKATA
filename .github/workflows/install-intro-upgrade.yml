name: Install intro animation upgrade

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install script tag
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'intro-upgrade.js' index.html; then
            python - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text()
needle='</body>'
if needle not in s:
    raise SystemExit('index.html has no closing body tag')
s=s.replace(needle, '  <script src="intro-upgrade.js" defer></script>\n</body>', 1)
p.write_text(s)
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Enable polished opening intro animation'
            git push
          fi
      - name: Trigger Pages deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            });
      - name: Remove installer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-intro-upgrade.yml
          git add -A
          git commit -m 'Remove temporary intro installer' || true
          git push
