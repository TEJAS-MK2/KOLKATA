name: Install intro animation upgrade

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add intro script
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'intro-upgrade.js' index.html && exit 0
          python - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text()
needle='</body>'
if needle not in s:
    raise SystemExit('Missing closing body tag')
s=s.replace(needle, '  <script src="intro-upgrade.js" defer></script>\n</body>', 1)
p.write_text(s)
PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable polished opening intro animation'
          git push
      - name: Remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-intro-upgrade.yml
          git add -A
          git commit -m 'Remove temporary intro installer'
          git push
