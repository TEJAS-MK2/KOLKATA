name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css polish.css puja-assets.css details.css details.js production-bootstrap.js puja-config.js state-v3.js pandal-expansion-2026.js pandal-expansion-more-2026.js script.js core-data-controller-v2.js pandal-catalog-upgrade.js map-fallback.js explorer-v2.js pandal-personal-safe.js puja-countdown.js puja-companion-pro.js runtime-fixes.js puja-feature-suite.js puja-bingo.js puja-guides.js sw.js site.webmanifest icon.svg 404.html robots.txt sitemap.xml package.json tests/smoke.mjs tests/smoke-green.mjs; do test -s "$f"; done
          grep -q 'কলকাতা দুর্গাপূজা' index.html
          grep -q 'lang="bn-IN"' index.html
          grep -q 'canonical' index.html
          grep -q 'polish.css' index.html
          grep -q 'integrity="sha512-aNMyYYxdIxIaot0Y1/PLuEu3eipGCmsEUBrUq+7aVyPGMFH8z0eTP0tkqAvv34fzN6z+201d3T8HPb1svWSKHQ=="' index.html
          grep -q 'integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="' index.html
          for name in puja-config.js state-v3.js production-bootstrap.js pandal-expansion-2026.js pandal-expansion-more-2026.js script.js core-data-controller-v2.js details.js pandal-catalog-upgrade.js map-fallback.js explorer-v2.js pandal-personal-safe.js puja-countdown.js puja-companion-pro.js runtime-fixes.js puja-feature-suite.js puja-bingo.js puja-guides.js; do grep -q "src=\"$name\"" index.html; done
          grep -q '22–23 Oct' puja-companion-pro.js
          grep -q 'Math.floor((START-now)/86400000)' puja-companion-pro.js
          grep -q 'Puja Toolkit' puja-feature-suite.js
          grep -q 'Puja Passport' puja-feature-suite.js
          grep -q 'PUJA BINGO' puja-bingo.js
          for legacy in intro-upgrade.js pandal-personal.js puja2026-finalize.js puja2026-map-hotfix.js puja2026-qa-fix.js puja2026-suite.js puja2026-upgrade.js qa-hotfix.js qa-polish.js puja-companion.js puja-night-upgrade.js menu-fix.js filter-fix.js; do test ! -e "$legacy"; done
          if grep -R -n -E "kolkata-pujo-(favourites|visited|notes|route|completed|mode)|kolkata-puja-2026-(personal|suite)|kolkata-puja-bingo-v1" --include='*.js' . | grep -v '^./state-v3.js:'; then echo 'Legacy storage access remains outside state-v3.js'; exit 1; fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          bootstrap=Path('production-bootstrap.js').read_text(encoding='utf-8')
          block=bootstrap.split('const CANONICAL={',1)[1].split('};',1)[0]
          count=len(re.findall(r"^  '[^']+':\[",block,re.M))
          if count != 36: raise SystemExit(f'Expected 36 canonical pins, found {count}')
          html=Path('index.html').read_text(encoding='utf-8')
          required=['puja-config.js','state-v3.js','production-bootstrap.js','pandal-expansion-2026.js','pandal-expansion-more-2026.js','script.js','core-data-controller-v2.js','details.js','pandal-catalog-upgrade.js','map-fallback.js','explorer-v2.js','pandal-personal-safe.js','puja-countdown.js','puja-companion-pro.js','runtime-fixes.js','puja-feature-suite.js','puja-bingo.js','puja-guides.js']
          positions=[html.index(f'src="{name}"') for name in required]
          if positions != sorted(positions): raise SystemExit('Scripts are not in deterministic order')
          refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html)
          local=[r.split('?',1)[0].split('#',1)[0] for r in refs if not r.startswith(('#','http:','https:','data:','mailto:','//'))]
          missing=sorted({r for r in local if r and not Path(r).exists()})
          if missing: raise SystemExit('Missing local assets: '+', '.join(missing))
          PY
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js tests/*.mjs; do node --check "$f"; done
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Make third-party scripts non-blocking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          patterns=[
            r'(<script\b[^>]*src=["\']https://cdnjs\.cloudflare\.com/ajax/libs/animejs/3\.2\.2/anime\.min\.js["\'][^>]*?)(?:\s+(?:defer|async))?\s*>',
            r'(<script\b[^>]*src=["\']https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.js["\'][^>]*?)(?:\s+(?:defer|async))?\s*>'
          ]
          for pattern in patterns:
            html,n=re.subn(pattern,lambda m:m.group(1)+' async>',html,count=1,flags=re.I)
            if n != 1: raise SystemExit(f'Third-party script tag not found: {pattern}')
          path.write_text(html,encoding='utf-8')
          PY
          grep -q 'anime.min.js.*async' index.html
          grep -q 'unpkg.com/leaflet@1.9.4/dist/leaflet.js.*async' index.html
      - name: Run production browser smoke test
        run: npm run test:smoke
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
