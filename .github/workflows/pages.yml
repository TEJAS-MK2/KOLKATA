name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); tags=['<script src=\"intro-upgrade.js\" defer></script>','<script src=\"pandal-catalog-upgrade.js\" defer></script>','<script src=\"map-fallback.js\" defer></script>','<script src=\"puja2026-suite.js\" defer></script>','<script src=\"qa-polish.js\" defer></script>','<script src=\"explorer-v2.js\" defer></script>','<script src=\"puja-companion.js\" defer></script>','<script src=\"qa-hotfix.js\" defer></script>']; needle='</body>'; additions=''.join('  '+t+'\\n' for t in tags if t not in s); p.write_text(s.replace(needle, additions+needle, 1) if needle in s else s)"
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check intro-upgrade.js
          node --check pandal-catalog-upgrade.js
          node --check map-fallback.js
          node --check puja2026-suite.js
          node --check qa-polish.js
          node --check explorer-v2.js
          node --check puja-companion.js
          node --check qa-hotfix.js
          node --check sw.js
      - name: Validate site structure
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s details.js
          test -s puja-assets.css
          test -s 404.html
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest
          test -s puja-companion.js
          test -s sw.js
          grep -q 'কলকাতা দুর্গাপূজা' index.html
          grep -q 'canonical' index.html
          grep -q 'pandal-list' index.html
          grep -q 'pandal-map' index.html
          grep -q 'map-fallback.js' index.html
          grep -q 'qa-polish.js' index.html
          grep -q 'puja-companion.js' index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
