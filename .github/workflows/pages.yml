name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); tags=['<script src=\"intro-upgrade.js\" defer></script>','<script src=\"pandal-catalog-upgrade.js\" defer></script>','<script src=\"puja2026-upgrade.js\" defer></script>','<script src=\"puja2026-finalize.js\" defer></script>','<script src=\"puja2026-qa-fix.js\" defer></script>']; needle='</body>'; additions=''.join('  '+t+'\\n' for t in tags if t not in s); p.write_text(s.replace(needle, additions+needle, 1) if needle in s else s)"
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check intro-upgrade.js
          node --check pandal-catalog-upgrade.js
          node --check puja2026-upgrade.js
          node --check puja2026-finalize.js
          node --check puja2026-qa-fix.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
