name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="pandal-catalog-upgrade.js" defer></script>',
            '<script src="map-fallback.js" defer></script>',
            '<script src="explorer-v2.js" defer></script>',
            '<script src="puja-companion.js" defer></script>',
            '<script src="puja-night-upgrade.js" defer></script>',
            '<script src="pandal-personal.js" defer></script>',
            '<script src="menu-fix.js" defer></script>',
            '<script src="filter-fix.js" defer></script>',
            '<script src="puja-countdown.js" defer></script>',
            '<script src="puja-companion-pro.js" defer></script>',
            '<script src="runtime-fixes.js" defer></script>',
          ]
          needle='</body>'
          additions=''.join('  '+t+'\n' for t in tags if t not in s)
          if needle not in s:
              raise SystemExit('index.html has no closing body tag')
          p.write_text(s.replace(needle, additions+needle, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            script.js details.js pandal-catalog-upgrade.js map-fallback.js \
            explorer-v2.js puja-companion.js puja-night-upgrade.js pandal-personal.js \
            menu-fix.js filter-fix.js puja-countdown.js puja-companion-pro.js runtime-fixes.js sw.js
          do
            node --check "$f"
          done

      - name: Validate site structure and asset references
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s details.js
          test -s details.css
          test -s puja-assets.css
          test -s 404.html
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest
          test -s puja-companion.js
          test -s puja-night-upgrade.js
          test -s pandal-personal.js
          test -s menu-fix.js
          test -s filter-fix.js
          test -s puja-countdown.js
          test -s puja-companion-pro.js
          test -s runtime-fixes.js
          test -s sw.js
          grep -q 'কলকাতা দুর্গাপূজা' index.html
          grep -q 'canonical' index.html
          grep -q 'pandal-list' index.html
          grep -q 'pandal-map' index.html
          grep -q 'leaflet@1.9.4' index.html
          grep -q 'animejs/3.2.2' index.html
          grep -q 'runtime-fixes.js' index.html
          grep -q 'explorer-v2.js' index.html
          grep -q 'pandal-catalog-upgrade.js' index.html
          grep -q 'puja-companion-pro.js' index.html
          ! grep -q 'puja2026-suite.js' index.html
          ! grep -q 'qa-polish.js' index.html
          ! grep -q 'intro-upgrade.js' index.html
          ! grep -q 'qa-hotfix.js' index.html
          grep -q 'details.js' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html)
          local=[]
          for ref in refs:
              if ref.startswith(('#','http:','https:','data:','mailto:')): continue
              if ref.startswith('//'): continue
              local.append(ref.split('?',1)[0].split('#',1)[0])
          missing=sorted({r for r in local if r and not Path(r).exists()})
          if missing:
              raise SystemExit('Missing local assets: '+', '.join(missing))
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
