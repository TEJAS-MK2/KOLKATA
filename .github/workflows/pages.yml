name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
from pathlib import Path
p = Path('index.html')
s = p.read_text()
tag = '<script src="intro-upgrade.js" defer></script>'
if tag not in s:
    needle = '</body>'
    if needle not in s:
        raise SystemExit('index.html is missing its closing body tag')
    s = s.replace(needle, f'  {tag}\n{needle}', 1)
    p.write_text(s)
PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
