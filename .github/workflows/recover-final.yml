name: Recover final site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: recover-final
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore site and add final metadata
        shell: bash
        run: |
          set -euo pipefail
          git checkout a8d81649ee13c18716fb0ad6068e10de58065568 -- index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<meta name="description" content="KOLKATA — a digital celebration of Durga Puja 2026, Bengal\'s culture, art and the city that comes alive in autumn.">'
          new='''<meta name="description" content="কলকাতা দুর্গাপূজা ২০২৬ — explore Kolkata's Durga Puja culture, pandals, maps, routes and festival guidance.">\n  <meta name="robots" content="index,follow">\n  <link rel="canonical" href="https://tejas-mk2.github.io/KOLKATA/">\n  <meta property="og:type" content="website"><meta property="og:site_name" content="কলকাতা দুর্গাপূজা"><meta property="og:title" content="কলকাতা দুর্গাপূজা — ২০২৬"><meta property="og:description" content="Explore Kolkata's Durga Puja 2026 pandals, culture, maps and routes."><meta property="og:url" content="https://tejas-mk2.github.io/KOLKATA/">\n  <meta name="twitter:card" content="summary">\n  <link rel="manifest" href="site.webmanifest">'''
          if old in s and 'property="og:type"' not in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check intro-upgrade.js
          node --check pandal-catalog-upgrade.js
          node --check puja2026-suite.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore site and finalize SEO metadata'
          git push origin main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
