name: Details QA fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[details-qa]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pandal details integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          needle = "let activeZone='all', map, markers=[], routeStops=[], travelMode='walking';\nconst routeMax=8;\nlet nightIndex=0, completedStops=new Set();"
          replacement = needle + "\n\n// Expose shared state for the details modal without duplicating state.\nwindow.pandals = pandals;\nObject.defineProperty(window, 'routeStops', { configurable: true, get: () => routeStops });\nwindow.addToRoute = addToRoute;"
          if needle not in s:
              raise SystemExit('Expected route state declaration not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Fix pandal details integration [details-qa]'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/qa-fix-details.yml
          git commit -m 'Remove temporary details QA workflow [details-qa]'
          git push
