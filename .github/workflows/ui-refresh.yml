name: UI refresh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Apply product UI refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<span>KOLKATA</span><small>কলকাতা দুর্গাপূজা</small>','<span>কলকাতা দুর্গাপূজা</span><small>KOLKATA · 2026</small>')
          s=s.replace('<p class="eyebrow">THE CITY AWAKENS · 17—21 OCTOBER 2026</p><h1>শারদীয়া<br><em>Kolkata</em></h1>','<p class="eyebrow">KOLKATA · 17—21 OCTOBER 2026</p><h1>কলকাতা<br><em>দুর্গাপূজা</em></h1>')
          s=s.replace('<p class="hero-copy">Five days. A thousand stories. One city that feels like home.</p>','<p class="hero-copy">Pandals, people, food and the streets of Kolkata — all in one place.</p>')
          s=s.replace('<div class="section-label">04 / CITY GUIDE</div>','<div class="section-label">04 / EXPLORE</div>')
          s=s.replace('<h2>Find your<br><i>next pandal.</i></h2>','<h2>Explore<br><i>the city.</i></h2>')
          s=s.replace('<p>Search neighbourhoods, explore the map and build your own Pujo route.</p>','<p>Find pandals by neighbourhood, compare stops and build your Pujo route.</p>')
          s=s.replace('KOLKATA · SHARODOTSAV 2026','কলকাতা দুর্গাপূজা · ২০২৬')
          marker='</style>\n</head>'
          css='''
    /* Product UI refresh. Navigation labels intentionally remain English. */
    :root{--paper:#f6f2eb;--paper2:#eee8de;--ink:#171513;--muted:#6f6961;--line:#d9d1c5;--accent:#b73524}
    body{background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}.grain{display:none!important}
    .site-header{position:sticky!important;top:0;z-index:100;background:rgba(246,242,235,.95)!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important;backdrop-filter:blur(14px);padding:14px clamp(18px,4vw,52px)!important}.brand{color:var(--ink)!important}.brand span{font-family:'Noto Serif Bengali',serif!important;font-size:21px!important;letter-spacing:0!important}.brand small{color:var(--muted)!important}.site-header nav a{color:var(--ink)!important;font-size:13px!important;font-weight:600!important}.site-header nav a:hover{color:var(--accent)!important}.menu span{background:var(--ink)!important}
    .hero{min-height:min(700px,78vh)!important;border-radius:0!important;align-items:flex-end!important}.hero-image{filter:saturate(.7)!important}.hero-overlay{background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))!important}.hero-content{max-width:900px!important;padding:clamp(28px,6vw,72px)!important}.hero-content h1{font-family:'Noto Serif Bengali',serif!important;font-size:clamp(54px,9vw,108px)!important;line-height:.94!important;letter-spacing:-.04em!important}.hero-content h1 em{font-style:normal!important;color:#f2dfb7!important}.hero-copy{max-width:500px!important;font-size:16px!important;line-height:1.6!important}.button.primary{background:#fff!important;color:var(--ink)!important;border-radius:9px!important}.scroll-note,.hero-mark{display:none!important}
    .section{padding:clamp(58px,8vw,100px) clamp(18px,5vw,64px)!important;max-width:1320px;margin:auto}.section-label{color:var(--accent)!important;font-weight:700!important;letter-spacing:.14em!important}.intro h2,.timeline h2,.guide h2{font-family:'DM Sans',sans-serif!important;font-weight:700!important;letter-spacing:-.045em!important;font-size:clamp(38px,5vw,64px)!important;line-height:.98!important}.intro h2 span,.timeline h2 i,.guide h2 i{font-family:'Noto Serif Bengali',serif!important;color:var(--accent)!important}.intro-text p,.timeline-head p,.guide-head p{color:var(--muted)!important;line-height:1.7!important}.stats{border-color:var(--line)!important}.stats div{border-color:var(--line)!important}.stats strong{color:var(--ink)!important}
    .days{gap:0!important;border:1px solid var(--line)!important;border-radius:14px!important;overflow:hidden;background:#fff!important}.days article{padding:24px!important;border-color:var(--line)!important}.days article:hover{background:var(--paper2)!important}.days small{color:var(--accent)!important}
    .culture-card{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:0 14px 35px rgba(25,20,15,.08)!important}.culture-card p{color:var(--muted)!important}.button.outline{border-color:var(--ink)!important;color:var(--ink)!important;border-radius:9px!important}
    .explorer-toolbar{margin:24px 0 16px!important}.explorer-search{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:9px!important}.filter-btn,.mode-btn{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}.filter-btn.active,.mode-btn.active{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}.explorer-layout{grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr)!important}.pandal-list{gap:10px!important;max-height:680px!important}.pandal-card{min-height:0!important;background:#fff!important;border:1px solid var(--line)!important;border-radius:13px!important;box-shadow:0 4px 16px rgba(25,20,15,.04)!important;transform:none!important}.pandal-card:hover,.pandal-card.selected{transform:none!important;border-color:var(--accent)!important;box-shadow:0 8px 24px rgba(25,20,15,.08)!important}.pandal-card img{height:155px!important;filter:none!important}.pandal-card h3{font-family:'DM Sans',sans-serif!important;font-size:18px!important;color:var(--ink)!important}.pandal-meta,.rating{color:var(--muted)!important}.pandal-actions button,.pandal-actions a{border-radius:8px!important;border-color:var(--line)!important;color:var(--ink)!important}.pandal-actions .route{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}.map-panel{min-height:680px!important;border-color:var(--line)!important;border-radius:13px!important;box-shadow:0 4px 18px rgba(25,20,15,.05)!important}.map-panel #pandal-map{min-height:680px!important}
    .route-planner,.night-mode{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:13px!important;box-shadow:0 4px 18px rgba(25,20,15,.04)!important}.route-planner h3,.night-mode h3,.night-stop h4{font-family:'DM Sans',sans-serif!important}.route-planner p,.route-hint,.night-stop p{color:var(--muted)!important}.route-stop,.night-stop{background:var(--paper)!important;border-color:var(--line)!important}.route-stop-index,.route-primary,.night-actions .night-primary{background:var(--accent)!important;color:#fff!important}.route-secondary,.night-actions button{color:var(--ink)!important;border-color:var(--line)!important;border-radius:8px!important}.night-progress{background:var(--paper2)!important}.night-progress-bar{background:var(--accent)!important}.gallery{background:var(--paper2)!important}.gallery .tile{border-radius:11px!important}.closing{background:var(--ink)!important}.closing h2{font-family:'DM Sans',sans-serif!important}.closing h2 i{font-family:'Noto Serif Bengali',serif!important;color:#f2dfb7!important}
    @media(max-width:800px){.site-header{padding:12px 16px!important}.hero{min-height:620px!important}.hero-content{padding:28px 20px 38px!important}.hero-content h1{font-size:54px!important}.section{padding:56px 18px!important}.explorer-layout{grid-template-columns:1fr!important}.pandal-list{order:1!important;max-height:none!important}.map-panel{order:2!important;min-height:380px!important;position:relative!important;top:auto!important}.map-panel #pandal-map{min-height:380px!important}.route-actions{display:grid!important}.route-actions>*{width:100%!important;box-sizing:border-box}}
          '''
          if marker in s and 'Product UI refresh.' not in s: s=s.replace(marker,css+'\n'+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply product UI refresh'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm -f .github/workflows/ui-refresh.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary UI refresh workflow'
          git push || true
