name: Replace unrelated imagery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unrelated imagery with Kolkata Puja imagery
        shell: bash
        run: |
          cat > puja-assets.css <<'EOF'
          :root{
            --hero-puja:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_01.jpg');
            --culture-puja:url('https://commons.wikimedia.org/wiki/Special:FilePath/Maa_Durga_Idol_at_Kumartuli.jpg');
            --gallery-1:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_02.jpg');
            --gallery-2:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_03.jpg');
            --gallery-3:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_04.jpg');
            --gallery-4:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Nandaram_Sen_Street_in_Kolkata_07.jpg')
          }
          .hero-image{background-image:var(--hero-puja)!important;background-position:center!important}
          .culture-photo{background-image:var(--culture-puja)!important;background-position:center!important}
          .tall{background-image:var(--gallery-1)!important}.wide{background-image:var(--gallery-2)!important}.square{background-image:var(--gallery-3)!important}.square.second{background-image:var(--gallery-4)!important}
          .gallery-grid .tile{filter:saturate(.9)}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<link rel="stylesheet" href="styles.css">'
          if 'puja-assets.css' not in s:
              s=s.replace(marker, marker+'<link rel="stylesheet" href="puja-assets.css">', 1)
          p.write_text(s)
          p=Path('script.js')
          s=p.read_text()
          s=s.replace("https://images.unsplash.com/photo-1602774895192-7f4d5c8f8f4a?auto=format&fit=crop&w=900&q=80", "https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_04.jpg")
          s=s.replace("https://commons.wikimedia.org/wiki/Special:FilePath/Kumartuli%2C_Kolkata.jpg',rating:0},", "https://commons.wikimedia.org/wiki/Special:FilePath/Shobhabazar_Rajbari_Durga_Puja.jpg',rating:0},")
          p.write_text(s)
          PY
          git add index.html script.js puja-assets.css
          git diff --cached --quiet || git commit -m "Replace unrelated imagery with Kolkata Puja photos"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/puja-asset-fix.yml
          git add .github/workflows/puja-asset-fix.yml
          git commit -m "Remove temporary imagery fix workflow"
          git push
