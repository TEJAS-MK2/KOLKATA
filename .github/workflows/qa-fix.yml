name: QA fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[qa-fix]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix QA findings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="section-label">05 / MOMENTS</div>'
          new = '<div class="section-label">06 / MOMENTS</div>'
          if old not in s:
              raise SystemExit('Expected gallery section label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix QA findings [qa-fix]'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/qa-fix.yml
          git commit -m 'Remove temporary QA workflow [qa-fix]'
          git push
