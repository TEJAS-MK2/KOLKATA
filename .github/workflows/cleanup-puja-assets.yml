name: Clean Puja imagery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unrelated imagery and verify sources
        shell: bash
        run: |
          set -e
          cat > puja-assets.css <<'EOF'
          :root{
            --hero-puja:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_01.jpg');
            --culture-puja:url('https://commons.wikimedia.org/wiki/Special:FilePath/Maa_Durga_Idol_at_Kumartuli.jpg');
            --gallery-1:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_02.jpg');
            --gallery-2:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_03.jpg');
            --gallery-3:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_04.jpg');
            --gallery-4:url('https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Nandaram_Sen_Street_in_Kolkata_07.jpg')
          }
          .hero-image{background-image:var(--hero-puja)!important;background-position:center!important}
          .culture-photo{background-image:var(--culture-puja)!important;background-position:center!important}
          .tall{background-image:var(--gallery-1)!important}.wide{background-image:var(--gallery-2)!important}.square{background-image:var(--gallery-3)!important}.square.second{background-image:var(--gallery-4)!important}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<link rel="stylesheet" href="styles.css">'
          if 'puja-assets.css' not in s:
              s=s.replace(marker, marker+'<link rel="stylesheet" href="puja-assets.css">', 1)
          p.write_text(s)
          p=Path('script.js')
          s=p.read_text()
          replacements={
            "https://commons.wikimedia.org/wiki/Special:FilePath/Kumartuli%2C_Kolkata.jpg":"https://commons.wikimedia.org/wiki/Special:FilePath/Shobhabazar_Rajbari_Durga_Puja.jpg",
            "https://images.unsplash.com/photo-1602774895192-7f4d5c8f8f4a?auto=format&fit=crop&w=900&q=80":"https://commons.wikimedia.org/wiki/Special:FilePath/DurgaPuja2019_-_Durga_Puja_pandal_of_Kumartoli_Park_in_Kolkata_04.jpg"
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('styles.css')
          s=p.read_text()
          replacements={
            "https://images.unsplash.com/photo-1605537964076-3cb0ea3c7c5a?auto=format&fit=crop&w=2200&q=85":"var(--hero-puja)",
            "https://images.unsplash.com/photo-1597045566677-8cf032ed6634?auto=format&fit=crop&w=1400&q=85":"var(--culture-puja)",
            "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1200&q=85":"var(--gallery-1)",
            "https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1000&q=85":"var(--gallery-2)",
            "https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=900&q=85":"var(--gallery-3)",
            "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85":"var(--gallery-4)"
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)
          PY
          if grep -RniE 'images\.unsplash\.com|taj mahal' -- *.html *.css *.js; then
            echo 'Unrelated stock imagery remains in source.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js styles.css puja-assets.css
          git diff --cached --quiet || git commit -m 'Use Kolkata Durga Puja imagery throughout site'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-puja-assets.yml
          git add .github/workflows/cleanup-puja-assets.yml
          git commit -m 'Remove temporary Puja asset cleanup workflow'
          git push
