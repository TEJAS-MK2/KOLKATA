name: Final asset verification fix

on:
  push:
    paths:
      - .github/workflows/final-asset-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace verified broken asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          old='https://commons.wikimedia.org/wiki/Special:FilePath/%E0%A6%AC%E0%A6%BE%E0%A6%97%E0%A6%AC%E0%A6%BE%E0%A6%9C%E0%A6%BE%E0%A6%B0_%E0%A6%B8%E0%A6%BE%E0%A6%B0%E0%A7%8D%E0%A6%AC%E0%A6%9C%E0%A6%BE%E0%A6%A8%E0%A7%80%E0%A6%A8_%E0%A6%A6%E0%A5%81%E0%A4%B0%E0%A5%8D%E0%A4%97%E0%A5%8B%E0%A4%A4%E0%A5%8D%E0%A4%B8%E0%A4%AC_%E0%A5%A8%E0%A5%A6%E0%A5%A7%E0%A5%82.jpg'
          new='https://commons.wikimedia.org/wiki/Special:FilePath/Bagbazar_Sarbojonin_Durgotsov.jpg'
          assert old in s, 'Expected broken Bagbazar URL was not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Bagbazar_Sarbojonin_Durgotsov.jpg' script.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Fix Bagbazar archive image URL'
          git push
      - name: Remove workflow
        shell: bash
        run: |
          git rm .github/workflows/final-asset-fix.yml
          git commit -m 'Remove temporary asset verification workflow'
          git push
