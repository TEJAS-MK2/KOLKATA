name: Repair KOLKATA site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[site-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair source files
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          replacements = {
              '<span>KOLKATA</span><small>কলকাতা দুর্গাপূজা</small>': '<span class="brand-bengali">কলকাতা দুর্গাপূজা</span><small>2026</small>',
              'THE CITY AWAKENS · 17—21 OCTOBER 2026': 'MAHALAYA 10 OCTOBER · PUJA 15—26 OCTOBER 2026',
              '<p class="eyebrow">KOLKATA · SHARODOTSAV 2026</p>': '<p class="eyebrow">কলকাতা দুর্গাপূজা · ২০২৬</p>',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          marker = '<div class="explorer-toolbar">'
          info = '''<div class="puja-2026-info" aria-label="2026 Puja guidance">
            <div><strong>2026 dates</strong><span>Mahalaya · 10 Oct</span><span>Chaturthi · 15 Oct</span><span>Ashtami · 19 Oct</span><span>Navami · 20 Oct</span><span>Dashami · 21 Oct</span></div>
            <div><strong>State guidance</strong><span>₹1 lakh grant for eligible small/low-budget committees</span><span>Free electricity and fire-licence fee waiver</span><span>DJ use prohibited during Puja and immersion</span></div>
          </div>\n      '''
          if 'class="puja-2026-info"' not in html and marker in html:
              html = html.replace(marker, info + marker, 1)

          index.write_text(html, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          old_header = """window.addEventListener('scroll', () => {\n  const y = window.scrollY;\n  header.style.background = y > 40 ? 'rgba(18,10,8,.82)' : 'transparent';\n  header.style.backdropFilter = y > 40 ? 'blur(14px)' : 'none';\n  header.style.transition = 'background .25s ease, backdrop-filter .25s ease';\n  const hero = document.querySelector('.hero-image');\n  if (hero && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) hero.style.transform = `translateY(${Math.min(y * 0.16, 90)}px) scale(1.04)`;\n}, { passive: true });"""
          new_header = """window.addEventListener('scroll', () => {\n  const y = window.scrollY;\n  if (header) {\n    header.classList.toggle('is-scrolled', y > 40);\n    header.style.transition = 'background .25s ease, box-shadow .25s ease';\n  }\n  const hero = document.querySelector('.hero-image');\n  if (hero && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) hero.style.transform = `translateY(${Math.min(y * 0.08, 50)}px) scale(1.02)`;\n}, { passive: true });"""
          if old_header in js:
              js = js.replace(old_header, new_header, 1)

          old_photo = 'https://commons.wikimedia.org/wiki/Special:FilePath/%E0%A6%AC%E0%A6%BE%E0%A6%97%E0%A6%AC%E0%A6%BE%E0%A6%9C%E0%A6%BE%E0%A6%B0_%E0%A6%B8%E0%A6%BE%E0%A6%B0%E0%A7%8D%E0%A6%AC%E0%A6%9C%E0%A6%BE%E0%A6%A8%E0%A7%80%E0%A6%A8_%E0%A6%A6%E0%A7%81%E0%A6%B0%E0%A7%8D%E0%A4%97%E0%A5%8B%E0%A4%A4%E0%A4%B8%E0%A4%AC_%E0%A5%A8%E0%A5%A6%E0%A5%A2018.jpg'
          new_photo = 'https://commons.wikimedia.org/wiki/Special:FilePath/Ballygunge_Durga_Puja_Samiti_Maddox_Square_Kolkata_2017.jpg'
          js = js.replace(old_photo, new_photo)
          script.write_text(js, encoding='utf-8')

          css = Path('styles.css')
          style = css.read_text(encoding='utf-8')
          additions = '''\n/* 2026 repair pass */\n.site-header.is-scrolled{background:rgba(247,244,238,.96)!important;box-shadow:0 6px 24px rgba(24,21,18,.07)}\n.brand-bengali{font-family:var(--bengali);letter-spacing:0;font-size:18px}\n.puja-2026-info{max-width:var(--max);margin:0 auto 18px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 2px 8px rgba(24,21,18,.03)}\n.puja-2026-info div{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}\n.puja-2026-info strong{width:100%;font-size:12px}\n.puja-2026-info span{font-size:11px;line-height:1.45;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}\n@media(max-width:800px){.puja-2026-info{grid-template-columns:1fr;gap:12px}.brand-bengali{font-size:16px}.site-header{height:64px}.hero{min-height:640px;height:78vh;padding-bottom:54px}.hero h1{font-size:clamp(48px,15vw,78px)}}\n'''
          if '/* 2026 repair pass */' not in style:
              css.write_text(style + additions, encoding='utf-8')

      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js styles.css
          git diff --cached --quiet || git commit -m 'Fix KOLKATA site issues [site-repair]'
          git push

      - name: Remove repair workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-site.yml
          git add .github/workflows/fix-site.yml
          git commit -m 'Remove temporary site repair workflow [site-repair]'
          git push
