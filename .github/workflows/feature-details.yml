name: Add Pandal Details

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-details:
    if: ${{ github.event.head_commit.message != 'Add pandal details experience' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build details feature
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text()
          css_tag = '<link rel="stylesheet" href="details.css">'
          js_tag = '<script src="details.js" defer></script>'
          modal = '''\n  <div id="pandal-details" class="pandal-details" hidden aria-hidden="true">\n    <div class="pandal-details-backdrop" data-details-close></div>\n    <section class="pandal-details-dialog" role="dialog" aria-modal="true" aria-labelledby="details-title">\n      <button class="pandal-details-close" type="button" data-details-close aria-label="Close pandal details">×</button>\n      <div class="pandal-details-media"><img id="details-image" alt="" loading="eager"></div>\n      <div class="pandal-details-content">\n        <div id="details-zone" class="details-kicker"></div>\n        <h2 id="details-title"></h2>\n        <p id="details-summary" class="details-summary"></p>\n        <div class="details-facts"><div><span>Area</span><strong id="details-area"></strong></div><div><span>Zone</span><strong id="details-zone-fact"></strong></div><div><span>Rating</span><strong id="details-rating"></strong></div></div>\n        <div class="details-actions"><button id="details-route" class="details-primary" type="button">Add to Puja Night +</button><a id="details-directions" class="details-secondary" target="_blank" rel="noopener">Navigate ↗</a></div>\n        <p class="details-note">Archive imagery and visitor ratings are indicative. Confirm 2026 timings with the committee before visiting.</p>\n      </div>\n    </section>\n  </div>\n'''
          if 'id="pandal-details"' not in html:
              html = html.replace('</body>', modal + '  ' + css_tag + '\n  ' + js_tag + '\n</body>')
          index.write_text(html)

          Path('details.css').write_text('''/* Pandal details */\n.pandal-details{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px}.pandal-details[hidden]{display:none}.pandal-details-backdrop{position:absolute;inset:0;background:rgba(8,5,4,.78);backdrop-filter:blur(10px)}.pandal-details-dialog{position:relative;z-index:1;width:min(980px,96vw);max-height:90vh;overflow:auto;display:grid;grid-template-columns:minmax(280px,.9fr) 1.1fr;background:var(--cream);color:var(--ink);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.pandal-details-media{min-height:520px;background:#20120f}.pandal-details-media img{display:block;width:100%;height:100%;min-height:520px;object-fit:cover}.pandal-details-close{position:absolute;right:16px;top:16px;z-index:2;width:44px;height:44px;border:1px solid rgba(243,234,217,.35);border-radius:50%;background:rgba(20,12,10,.72);color:#fff;font-size:26px;cursor:pointer}.pandal-details-content{padding:clamp(28px,5vw,58px);display:flex;flex-direction:column;justify-content:center}.details-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:700}.pandal-details-content h2{font:600 clamp(42px,5vw,72px)/.95 var(--serif);letter-spacing:-.04em;margin:16px 0}.details-summary{font-size:16px;line-height:1.75;color:#5f554a;max-width:500px}.details-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.details-facts div{padding:14px;border-top:1px solid rgba(22,13,11,.16)}.details-facts span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#756b5e;margin-bottom:5px}.details-facts strong{font:600 17px var(--serif)}.details-actions{display:flex;gap:10px;flex-wrap:wrap}.details-primary,.details-secondary{min-height:46px;padding:0 18px;border-radius:999px;font:600 12px var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.details-primary{border:0;background:var(--ink);color:var(--cream)}.details-secondary{border:1px solid rgba(22,13,11,.2);color:var(--ink);background:transparent}.details-note{font-size:10px;line-height:1.6;color:#8a7d6d;margin:18px 0 0;max-width:500px}@media(max-width:700px){.pandal-details{padding:10px}.pandal-details-dialog{display:block;width:100%;max-height:94vh;border-radius:20px}.pandal-details-media,.pandal-details-media img{min-height:240px;height:240px}.pandal-details-content{padding:26px 22px 24px}.pandal-details-content h2{font-size:42px}.details-summary{font-size:14px}.details-facts{grid-template-columns:1fr 1fr}.details-facts div:last-child{grid-column:1/-1}.details-actions{display:grid;grid-template-columns:1fr}.details-primary,.details-secondary{width:100%;box-sizing:border-box}}''')

          Path('details.js').write_text('''(()=>{\n  const modal=document.querySelector('#pandal-details');\n  if(!modal)return;\n  const image=document.querySelector('#details-image'),zone=document.querySelector('#details-zone'),title=document.querySelector('#details-title'),summary=document.querySelector('#details-summary'),area=document.querySelector('#details-area'),zoneFact=document.querySelector('#details-zone-fact'),rating=document.querySelector('#details-rating'),route=document.querySelector('#details-route'),directions=document.querySelector('#details-directions');\n  let current=null,previousFocus=null;\n  const descriptions={\n    'Bagbazar Sarbojanin':'A heritage favourite in North Kolkata, known for its long-running community Puja and classic Bagbazar atmosphere.',\n    'Kumartuli Park':'A North Kolkata stop beside the artisan quarter, pairing pandal culture with the neighbourhood where many Durga idols are made.',\n    'Shobhabazar Rajbari':'A historic North Kolkata experience centred on the old Rajbari tradition and a very different sense of Puja scale.',\n    'College Square':'A Central Kolkata favourite around College Street, especially atmospheric when the surrounding streets light up at night.',\n    'Santosh Mitra Square':'A Central Kolkata theme-driven stop in the Sealdah area, best treated as one of the route highlights when crowd conditions allow.',\n    'Maddox Square':'A classic South Kolkata adda spot in Ballygunge with a relaxed neighbourhood identity and a strong evening atmosphere.',\n    'Deshapriya Park':'A major South Kolkata stop around Deshapriya Park, useful as an anchor for a wider south-side Puja route.',\n    'Naktala Udayan Sangha':'A neighbourhood favourite in Naktala, suited to visitors who want to explore beyond the central headline pandals.'\n  };\n  function findPandal(name){return window.pandals?.find?.(p=>p.name===name)||null;}\n  function openDetails(p){\n    if(!p)return; current=p; previousFocus=document.activeElement;\n    image.src=p.photo; image.alt=`Archive photo associated with ${p.name}`; image.onerror=()=>{image.removeAttribute('src');image.alt='Archive image unavailable';};\n    zone.textContent=`${p.zone} Kolkata · ${p.tag}`; title.textContent=p.name; summary.textContent=descriptions[p.name]||`Explore ${p.name} in ${p.area}, ${p.zone} Kolkata.`; area.textContent=p.area; zoneFact.textContent=p.zone; rating.textContent=p.rating?`${p.rating.toFixed(1)} / 5`:'Not rated';\n    directions.href=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${p.lat},${p.lng}`)}`;\n    const inRoute=window.routeStops?.some?.(x=>x.name===p.name); route.textContent=inRoute?'Added ✓':'Add to Puja Night +'; route.disabled=!!inRoute;\n    modal.hidden=false; modal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; document.querySelector('.pandal-details-close')?.focus();\n  }\n  function closeDetails(){modal.hidden=true;modal.setAttribute('aria-hidden','true');document.body.style.overflow='';previousFocus?.focus?.();current=null;}\n  document.addEventListener('click',e=>{\n    const card=e.target.closest?.('.pandal-card');\n    if(card&&!e.target.closest('a,button'))openDetails(findPandal(card.dataset.name));\n    if(e.target.matches?.('[data-details-close]'))closeDetails();\n  });\n  route?.addEventListener('click',()=>{if(!current)return; if(window.addToRoute){window.addToRoute(current); route.textContent='Added ✓'; route.disabled=true;}});\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeDetails();});\n})();''')
      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html details.css details.js .github/workflows/feature-details.yml
          git commit -m "Add pandal details experience"
          git rm .github/workflows/feature-details.yml
          git commit -m "Remove one-time feature workflow"
          git push
