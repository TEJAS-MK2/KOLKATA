name: UI
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/<span>KOLKATA<\/span><small>কলকাতা দুর্গাপূজা<\/small>/<span>কলকাতা দুর্গাপূজা<\/span><small>KOLKATA · 2026<\/small>/' index.html
          sed -i 's/<p class="eyebrow">THE CITY AWAKENS · 17—21 OCTOBER 2026<\/p><h1>শারদীয়া<br><em>Kolkata<\/em><\/h1>/<p class="eyebrow">KOLKATA · 17—21 OCTOBER 2026<\/p><h1>কলকাতা<br><em>দুর্গাপূজা<\/em><\/h1>/' index.html
          sed -i 's/Five days\. A thousand stories\. One city that feels like home\./Pandals, people, food and the streets of Kolkata — all in one place./' index.html
          sed -i 's/04 \/ CITY GUIDE/04 \/ EXPLORE/' index.html
          sed -i 's/Find your<br><i>next pandal\.<\/i>/Explore<br><i>the city\.<\/i>/' index.html
          sed -i 's/Search neighbourhoods, explore the map and build your own Pujo route\./Find pandals by neighbourhood, compare stops and build your Pujo route./' index.html
          cat >> styles.css <<'CSS'
/* Final product UI layer. Navigation labels stay English. */
body{background:#f6f2eb!important;color:#171513!important;font-family:'DM Sans',system-ui,sans-serif!important}.grain{display:none!important}.site-header{position:sticky!important;top:0!important;background:rgba(246,242,235,.95)!important;color:#171513!important;border-bottom:1px solid #d9d1c5!important;backdrop-filter:blur(14px)!important}.brand span{font-family:'Noto Serif Bengali',serif!important;letter-spacing:0!important}.brand small{color:#6f6961!important}.site-header nav a{color:#171513!important;font-weight:600!important}.menu span{background:#171513!important}.hero{min-height:min(700px,78vh)!important;height:auto!important;border-radius:0!important}.hero-image{filter:saturate(.7)!important}.hero-overlay{background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.8))!important}.hero-content h1{font-family:'Noto Serif Bengali',serif!important;font-size:clamp(54px,9vw,108px)!important;line-height:.94!important}.hero-content h1 em{font-style:normal!important;color:#f2dfb7!important}.scroll-note,.hero-mark{display:none!important}.section{padding:clamp(58px,8vw,100px) clamp(18px,5vw,64px)!important}.section h2{font-family:'DM Sans',sans-serif!important;font-weight:700!important;letter-spacing:-.045em!important}.section h2 span,.section h2 i{font-family:'Noto Serif Bengali',serif!important;color:#b73524!important}.section-label{color:#b73524!important}.intro,.guide{background:#f6f2eb!important}.timeline{background:#171513!important}.days{background:#fff!important;border:1px solid #d9d1c5!important;border-radius:14px!important;overflow:hidden}.days article{border-color:#d9d1c5!important}.days article:hover{background:#eee8de!important}.culture{background:#eee8de!important}.culture-card{background:#fff!important;color:#171513!important;border:1px solid #d9d1c5!important;border-radius:16px!important;box-shadow:0 14px 35px rgba(25,20,15,.08)!important}.culture-card p{color:#6f6961!important}.explorer-search{background:#fff!important;color:#171513!important;border-color:#d9d1c5!important;border-radius:9px!important}.filter-btn,.mode-btn{background:#fff!important;color:#171513!important;border-color:#d9d1c5!important;border-radius:8px!important}.filter-btn.active,.mode-btn.active{background:#171513!important;color:#fff!important;border-color:#171513!important}.pandal-card{background:#fff!important;border-color:#d9d1c5!important;border-radius:13px!important;box-shadow:0 4px 16px rgba(25,20,15,.04)!important;transform:none!important}.pandal-card:hover,.pandal-card.selected{border-color:#b73524!important;box-shadow:0 8px 24px rgba(25,20,15,.08)!important;transform:none!important}.pandal-card img{filter:none!important}.pandal-card h3{font-family:'DM Sans',sans-serif!important;color:#171513!important}.pandal-meta,.rating{color:#6f6961!important}.pandal-actions button,.pandal-actions a{background:#f6f2eb!important;color:#171513!important;border-color:#d9d1c5!important;border-radius:8px!important}.pandal-actions .route{background:#b73524!important;color:#fff!important;border-color:#b73524!important}.map-panel{border-color:#d9d1c5!important;border-radius:13px!important;box-shadow:0 4px 18px rgba(25,20,15,.05)!important}.route-planner,.night-mode{background:#fff!important;color:#171513!important;border-color:#d9d1c5!important;border-radius:13px!important;box-shadow:0 4px 18px rgba(25,20,15,.04)!important}.route-planner p,.route-hint,.night-stop p{color:#6f6961!important}.route-stop,.night-stop{background:#f6f2eb!important;border-color:#d9d1c5!important}.route-primary,.night-actions .night-primary{background:#b73524!important;color:#fff!important;border-color:#b73524!important}.route-secondary,.night-actions button{color:#171513!important;border-color:#d9d1c5!important;border-radius:8px!important}.night-progress{background:#eee8de!important}.night-progress-bar{background:#b73524!important}.gallery{background:#eee8de!important;color:#171513!important}.closing{background:#171513!important}.closing h2 i{font-family:'Noto Serif Bengali',serif!important;color:#f2dfb7!important}@media(max-width:800px){.hero{min-height:620px!important}.hero-content{padding:28px 20px 40px!important}.hero-content h1{font-size:54px!important}.section{padding:56px 18px!important}.pandal-list{order:1!important}.map-panel{order:2!important;min-height:380px!important}.map-panel #pandal-map{min-height:380px!important}}
CSS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css
          git commit -m 'Apply product UI refresh' || true
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/ui.yml || true
          git commit -m 'Remove temporary UI workflow' || true
          git push || true
